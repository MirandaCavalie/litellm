name: router accounting diagnostic
permissions:
  contents: read
jobs:
  rust-bridge:
    name: rust-bridge
    permissions:
      contents: read
      actions: read
    outputs:
      artifact: ${{ steps.rust-bridge-artifact.outputs.name }}
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: '3.12'
    steps:
    - name: Download native artifact from the exact main baseline
      uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
      with:
        run-id: '44021901467'
        github-token: ${{ github.token }}
        path: rust-bridge-dist
        merge-multiple: true
        name: rust-bridge-44021901467-1
    - name: Upload exact baseline artifact for the diagnostic shard
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
      with:
        name: rust-bridge-${{ github.run_id }}-${{ github.run_attempt }}
        path: rust-bridge-dist/
        retention-days: 1
    - name: Expose artifact
      id: rust-bridge-artifact
      run: echo "name=rust-bridge-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
  unit:
    name: ${{ matrix.shard }}
    needs: rust-bridge
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job-timeout-minutes }}
    permissions:
      contents: read
      pull-requests: read
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: proxy-infra-root-q-z
          test-path: 'tests/unit/proxy/test_[q-z]*.py

            --deselect=tests/unit/proxy/test_reducto_ocr_route.py

            --deselect=tests/unit/proxy/test_response_polling_pre_call_checks.py

            --deselect=tests/unit/proxy/test_server_root_path.py

            --deselect=tests/unit/proxy/test_ui_path_detection.py

            --deselect=tests/unit/proxy/test_unit_test_proxy_hooks.py

            --deselect=tests/unit/proxy/test_update_spend.py

            --deselect=tests/unit/proxy/test_zero_cost_model_budget_bypass.py'
          python-version: '3.12'
          workers: 4
          reruns: 0
          timeout-minutes: 25
          job-timeout-minutes: 60
          dist: loadscope
    steps:
    - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      timeout-minutes: 3
      with:
        persist-credentials: false
        fetch-depth: 1
    - name: Detect relevant changes
      id: changes
      timeout-minutes: 2
      uses: ./.github/actions/detect-changes
    - name: Set up Python
      if: steps.changes.outputs.decision != 'skip'
      timeout-minutes: 3
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: ${{ env.UV_PYTHON }}
    - name: Set up uv
      if: steps.changes.outputs.decision != 'skip'
      timeout-minutes: 3
      uses: ./.github/actions/setup-uv-with-retries
      with:
        version: 0.10.9
    - name: Cache uv dependencies
      if: steps.changes.outputs.decision != 'skip'
      timeout-minutes: 5
      uses: ./.github/actions/cache-uv-downloads
    - name: Set up the Rust build
      if: steps.changes.outputs.decision != 'skip'
      timeout-minutes: 5
      uses: ./.github/actions/rust-bridge
      with:
        artifact: ${{ needs.rust-bridge.outputs.artifact }}
    - name: Install dependencies
      if: steps.changes.outputs.decision != 'skip'
      timeout-minutes: 5
      env:
        RUST_BRIDGE_ARTIFACT: ${{ needs.rust-bridge.outputs.artifact }}
      run: "diff -u model_prices_and_context_window.json litellm/model_prices_and_context_window_backup.json\nif [ -z \"$RUST_BRIDGE_ARTIFACT\"\
        \ ]; then\n  .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra\
        \ proxy --extra semantic-router --extra switchyard --extra saml --extra extra_proxy --extra proxy-runtime --extra\
        \ utils\nelse\n  .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra google --extra\
        \ proxy --extra semantic-router --extra switchyard --extra saml --extra extra_proxy --extra proxy-runtime --extra\
        \ utils --no-install-project --no-install-package litellm-proxy\n  uv pip install --no-deps --python .venv/bin/python\
        \ rust-bridge-dist/*.whl\n  cp rust-bridge-dist/litellm/rust_bridge/_native.abi3.so litellm/rust_bridge/_native.abi3.so\n\
        \  uv run --no-sync python -c \"import importlib.metadata; import litellm.rust_bridge._native; print(importlib.metadata.version('litellm'))\"\
        \nfi\nuv run --no-sync python -c 'import os, sys; print(sys.version); assert f\"{sys.version_info.major}.{sys.version_info.minor}\"\
        \ == os.environ[\"UV_PYTHON\"]'\n"
    - name: Check litellm/schema.prisma against the merge base
      if: steps.changes.outputs.decision != 'skip' && matrix.shard == 'db-and-spend' && github.event_name == 'pull_request'
      timeout-minutes: 3
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: 'base_ref=$(gh api "repos/${GITHUB_REPOSITORY}/branches/${EVENT_BASE_REF}" --jq .name) || base_ref=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
        --jq .base.ref)

        merge_base=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${base_ref}...${HEAD_SHA}?per_page=1" --jq ''.merge_base_commit.sha'')

        test -n "$merge_base"

        git fetch --no-tags --depth=1 origin "$merge_base"

        uv run --no-sync python litellm/scripts/check_schema_compatibility.py --base-commit "$merge_base"

        '
    - name: Cache Prisma binaries
      if: steps.changes.outputs.decision != 'skip'
      timeout-minutes: 3
      uses: ./.github/actions/cache-prisma-binaries
    - name: Generate Prisma client
      if: steps.changes.outputs.decision != 'skip'
      timeout-minutes: 3
      run: 'uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma

        '
    - name: Add temporary accounting probe
      run: "cat > router_ci_probe.py <<'PROBE'\nimport pytest\n\nTARGET = \"test_a_proxy_router_on_the_same_strategy_leaves_the_user_config_limit_unchanged\"\
        \nevents = []\n\ndef record(*event):\n    events.append(event)\n\n@pytest.fixture(autouse=True)\ndef accounting_probe():\n\
        \    events.clear()\n    yield\n    print(\"ACCOUNTING_EVENTS\", events)\n\ndef pytest_generate_tests(metafunc):\n\
        \    if metafunc.function.__name__ == TARGET:\n        metafunc.parametrize(\"accounting_probe\", range(10), indirect=True)\n\
        PROBE\nuv run --no-sync python - <<'PATCH'\nfrom pathlib import Path\np = Path(\"litellm/router_strategy/lowest_tpm_rpm_v2.py\"\
        )\ns = p.read_text()\na = \"        if tpm_values is None or rpm_values is None:\\n\"\nb = '        __import__(\"\
        router_ci_probe\").record(\"admission\", id(self), tpm_values, rpm_values)\\n' + a\nassert s.count(a) == 1\ns = s.replace(a,\
        \ b)\na = \"        await self.usage.increment_post_call((CounterIncrement(counter, tokens, self.routing_args.ttl),))\"\
        \nb = a + '\\n        __import__(\"router_ci_probe\").record(\"increment\", id(self), tokens, dict(self.usage.snapshot()))'\n\
        assert s.count(a) == 1\np.write_text(s.replace(a, b))\np = Path(\"tests/unit/proxy/test_route_llm_request.py\")\n\
        s = p.read_text()\na = \"    await _settle_router_accounting()\\n    return outcome\"\nb = '    await _settle_router_accounting()\\\
        n    __import__(\"router_ci_probe\").record(\"outcome\", outcome)\\n    return outcome'\nassert s.count(a) == 1\n\
        p.write_text(s.replace(a, b))\nPATCH\n"
    - name: Run tests
      id: tests
      if: steps.changes.outputs.decision != 'skip'
      timeout-minutes: ${{ matrix.timeout-minutes }}
      env:
        TEST_PATH: ${{ matrix.test-path }}
        MAX_FAILURES: '3'
        WORKERS: ${{ matrix.workers }}
        RERUNS: ${{ matrix.reruns }}
        TEST_TIMEOUT_SECONDS: '120'
        DIST: ${{ matrix.dist }}
        COVERAGE_CORE: sysmon
        PYTEST_ADDOPTS: -p router_ci_probe
        PYTHONPATH: .
      run: "echo \"has-coverage=false\" >> \"$GITHUB_OUTPUT\"\nselection=\"${TEST_PATH}\"\nif [ -z \"${selection// /}\" ];\
        \ then\n  echo \"shard selection is empty; nothing to run\"\n  exit 0\nfi\npytest_args=()\nexisting_paths=0\nfor token\
        \ in ${selection}; do\n  case \"${token}\" in\n    -*) pytest_args+=(\"${token}\") ;;\n    *)\n      if [ -e \"${token%%::*}\"\
        \ ]; then\n        pytest_args+=(\"${token}\")\n        existing_paths=$((existing_paths + 1))\n      else\n     \
        \   echo \"::warning::${token} does not exist; drop it from this shard's test-path\"\n      fi\n      ;;\n  esac\n\
        done\nif [ \"${existing_paths}\" -eq 0 ]; then\n  echo \"No path in the selection exists (${selection}); nothing to\
        \ run\"\n  exit 0\nfi\nxdist_args=()\nif [ \"${WORKERS}\" != \"0\" ]; then\n  xdist_args=(-n \"${WORKERS}\" --dist=\"\
        ${DIST}\")\nfi\nset +e\nuv run --no-sync pytest \"${pytest_args[@]}\" \\\n  --tb=short -vv \\\n  --maxfail=\"${MAX_FAILURES}\"\
        \ \\\n  \"${xdist_args[@]}\" \\\n  --reruns \"${RERUNS}\" \\\n  --reruns-delay 1 \\\n  --timeout=\"${TEST_TIMEOUT_SECONDS}\"\
        \ \\\n  --rerun-except \"from pytest-timeout\" \\\n  --durations=20 \\\n  --cov=./litellm --cov=./litellm/enterprise/litellm_enterprise\
        \ \\\n  --cov-report=xml:coverage.xml \\\n  --cov-config=pyproject.toml\nstatus=$?\nset -e\nif [ -f coverage.xml ];\
        \ then\n  echo \"has-coverage=true\" >> \"$GITHUB_OUTPUT\"\nfi\nif [ \"$status\" -eq 5 ]; then\n  echo \"pytest collected\
        \ no tests from ${selection}; passing\"\n  exit 0\nfi\nexit \"$status\"\n"
    - name: Save coverage report
      if: always() && steps.changes.outputs.decision != 'skip'
      uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
      with:
        name: coverage-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: coverage.xml
        retention-days: 1
'on':
  workflow_dispatch: null
